# Mirrors every push to main onto Firebase Hosting (https://ashlandthegame.web.app).
# GitHub Pages keeps serving https://ashlandthegame.com as before.
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASHLANDTHEGAME }}
          channelId: live
          projectId: ashlandthegame
